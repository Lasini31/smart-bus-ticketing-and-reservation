spring.config.import=optional:file:.env[.properties]
spring.application.name=busmanagement
server.port=8081

# ─── Supabase PostgreSQL (Transaction Pooler) ───────────────────────────────
# Set DB_URL, DB_USER, and DB_PASSWORD in backend/busmanagement/.env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'none' so Hibernate never auto-creates/drops tables in Supabase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Supabase JWT validation (JWKS) ─────────────────────────────────────────
# The frontend sends the Supabase access_token; Spring validates it here
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://rpbufjokybeukqcdfumq.supabase.co/auth/v1/.well-known/jwks.json

# ─── Auth mode ───────────────────────────────────────────────────────────────
# true  = bypass JWT (all requests permitted) — use during local development
# false = enforce Supabase JWT validation — use in production
app.auth.mock=true

# ─── Supabase REST API key (used by SupabaseAuthService) ────────────────────
supabase.url=https://rpbufjokybeukqcdfumq.supabase.co
supabase.api-key=sb_publishable_zWjaFipP-Rn95FQ44BRKbg_9WqwSPpi

